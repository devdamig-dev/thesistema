name: Production public smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/qa/public-production-smoke.test.mjs'
      - '.github/workflows/production-public-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tests/qa/public-production-smoke.test.mjs'
      - '.github/workflows/production-public-smoke.yml'
permissions:
  contents: read
jobs:
  smoke-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify public pages and assets on production domains
        run: node --test tests/qa/public-production-smoke.test.mjs
